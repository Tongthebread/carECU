name: DriveEval CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r backend/requirements.lock -e 'backend[test]'
      - run: cd backend && pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: driveeval
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: driveeval_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U driveeval -d driveeval_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock -e 'backend[test]'
      - run: cd backend && pytest -q
        env:
          DRIVEEVAL_TEST_DATABASE_URL: postgresql+psycopg://driveeval:test-password@localhost:5432/driveeval_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci
      - run: cd frontend && npm test
      - run: cd frontend && npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: curl --fail http://localhost:5173/health
      - if: always()
        run: docker compose logs --no-color && docker compose down
